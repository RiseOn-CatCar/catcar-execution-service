apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - dependencies.yaml
  - secret.yaml
patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: execution-service
    patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: execution-service
